[device]
codename = "warsaw"
brand = "Redmi"
model = "REDMI K90 Ultra"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop, which is
# the p12x panel's own mode in the device tree.
width = 1280
height = 2772
density = 480

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Goodix's, over SPI behind Xiaomi's touch layer, the one
# touch driver the phone's own modules.load lists. The secure element the
# weaver keeps a part of each user's secret in is the one built into the
# phone's NFC chip, which the phone reaches through NXP's driver for it;
# a recovery leaves every module of the vendor partition's list that it
# does not name out, and without this one the chip is not there to be
# opened.
load = ["goodix_core", "nxp-nci"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's Goodix one.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The eSE power manager, which the phone's own init starts as
# /vendor/bin/esepmdaemon in init.qcom.rc, before any program that talks to
# the embedded secure element: it loads that element's trusted app into the
# secure world and is the one thing that knows whether the element is
# powered, turning it on and off through the power request line NXP's NFC
# driver defines. The key service's secure element program, the weaver that
# keeps a part of each user's secret in the element, and so the screen lock,
# all fail without it: the element answers nothing, and the weaver turns
# every credential down, the right one as a wrong one.
[[service]]
path = "/vendor/bin/esepmdaemon"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["nfc"]

# WLAN: the kiwi node in the device tree, driven by qca_cld3_kiwi_v2, the
# one kiwi driver the phone's own modules.blocklist leaves of those its
# modules.load lists; the Peach, WCN7750 and QCA6750 drivers it lists as
# well are for chips the device tree has no node of. Its cfg80211 asks for
# rfkill, one of the kernel's own modules in system_dlkm, as the 17
# Ultra's does.
#
# The driver's firmware, and the apps the secure world runs, are on the
# modem partition: the vendor partition's firmware folder is a set of links
# into it. The stock recovery of OS4.0.8.0 mounts the modem partition from
# `/vendor/etc/charger_fstab.qti`, which that build no longer ships (it
# ships `charger_fw_fstab.qti` instead), so its own `on fs` section fails
# to mount it and the link at /vendor/firmware leads nowhere: the recovery
# mounts the partition itself, where the phone's own table mounts it, and
# shows it at /firmware as well. The settings and the MAC address are given
# to the loader again, the settings from the vendor partition and the
# address from where the vendor's link points in persist. wpa_supplicant
# runs on the recovery's own libraries before the vendor partition's, as on
# the 17 Ultra.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist, is
# not mounted here: the WLAN reads its MAC address from it on its own, and
# one f2fs cannot be mounted read-only beside a writable mount of it, which
# turns the whole WLAN away.
[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS4.0.8.0 (Android 17), whose full update package on the phone maker's own
# download server holds the recovery partition the recovery is built on top
# of.
[stock]
version = "OS4.0.8.0.XHPCNXM"
package = "https://bigota.d.miui.com/OS4.0.8.0.XHPCNXM/warsaw-ota_full-OS4.0.8.0.XHPCNXM-user-17.0-96194cf12c.zip"
recovery = "600a181d79c95d7155b9241fae15263586af7b527da2e6403c56f1d9834217d3"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
